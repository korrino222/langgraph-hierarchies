[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-hierarchies"
version = "0.0.6"
description = "LangGraph abstractions for hierarchical multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langgraph>=1.2.6,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/korrino222/langgraph-hierarchies"
Repository = "https://github.com/korrino222/langgraph-hierarchies"
Issues = "https://github.com/korrino222/langgraph-hierarchies/issues"
Changelog = "https://github.com/korrino222/langgraph-hierarchies/releases"

[tool.portfolio]
owner = "korrino222"
repo = "langgraph-hierarchies"
status = "active"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov",
]
lint = [
    "ruff>=0.9",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_hierarchies"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "us01: US-01 foundational layer regression tests",
    "us02: US-02 subagent state isolation regression tests",
    "us03: US-03 iteration budget enforcement regression tests",
    "us04: US-04 root compile and unified invocation regression tests",
    "us05: US-05 LangGraph compatibility harness meta-tests",
    "us06: US-06 IRS multi-stage hierarchy regression tests",
    "us07: US-07 responsibility boundary violation regression tests",
]

[tool.coverage.run]
source = ["langgraph_hierarchies"]
